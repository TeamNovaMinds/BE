  redis:
    image: 'redis:7.2-alpine'
    ports:
      - 6379:6379
    command: redis-server --appendonly yes --requirepass justfridge1234
    volumes:
      - redis_data:/data
    networks:
      - novaminds-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "justfridge1234", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  elasticsearch:
    build:
      context: .
      dockerfile: Dockerfile.elasticsearch
    environment:
      - discovery.type=single-node # 단일 노드 모드 설정, 다른 노드 탐색하지 않아서 실행 시간 줄어듬
      - xpack.security.enabled=false # 개발용으로 보안 기능 비활성화
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m" # 메모리 사용량을 512MB로 제한
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es-data-dev:/usr/share/elasticsearch/data
    networks:
      - novaminds-network

  kibana:
    image: kibana:8.18.6
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - novaminds-network

networks:
  novaminds-network:
    driver: bridge

volumes:
  #novaminds-mysql-data:
  redis_data:
  es-data-dev: